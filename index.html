<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Produc Selector</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <section class="store">
        <div class="container">
            <h1>Welcome to our store</h1>
            <h2>Check our available products</h2>
            <ul id="storeProductsList">


            </ul>
        </div>
    </section>


    <section class="notificationBar">
        <div class="container"></div>
    </section>

    <section class="cartSection">
        <div class="container">
            <h2>Shopping Cart</h2>
            <ul id="cartProductList">

            </ul>
            <div class="container">
                <div id="cartTotals">
                    <div id="itemstotal"></div>
                    <div id="pricetotal"></div>
                </div>
            </div>

        </div>
    </section>
    <section class="paymentSection">
        <div class="container">
            <div id="paymentButton"></div>
            <div id="clearButton"></div>
        </div>
    </section>

    <section class="formSection">
        <div class="container">
            <form id="paymentForm">

            </form>
            
        </div>
    </section>
    <script src="store.js" defer></script>
</body>
</html>
