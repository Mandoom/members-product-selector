<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Poke Store</title>
</head>
<body>
    <div class="overlay">
        <div class="blankPanel">
            <div class="productPanel"></div>
            <div class="cartPanel">
                <div class="container">
                    <h2>Your cart</h2>
                    <div class="cartHeaders">
                        <div class="cartItem">
                            <p class="producTitle">Product Name</p>
                            <div class="cartProductdDetails">
                                <div class="price detail-children">
                                    <p>Price</p>
                                </div>
    
                                <div class="quantity detail-children">
                                    <p>Quantity</p>
                                </div>
    
                               
                            </div>
                          
                        </div>
                    </div>
                    <div id="cartProductList">
                 
                    </div>

                    <div class="payment Options">

                    </div>
               </div>
            </div>
        </div>

    </div>
    <nav>
        <div class="nav">
            <div class="logo"></div>
            <div class="trainerinfo"></div>
            <div class="tools"></div>
        </div>
    </nav>
    <main>
        <div class="content">
         
            <div class="products">
               <div class="container">
                    <h2>Selected products for your Adventures!</h2>
                    <div id="storeProductList">
                    
                    </div>

                    <div class="productCategorySelection">

                    </div>
               </div>
            </div>
          
        </div>
    </main>
    <footer></footer>

    
    <script src="store.js" async></script>    
</body>

</html>
